# Workspace for the host-side crates (the Wasmtime host, supervisor, difftest
# and bench drivers). Guest programs and standalone harnesses are not members:
# they build with rustc.wasm or their own pinned dependency graphs.
#
# Wasmtime is pinned to one exact version for every member: `.cwasm` artifacts
# are tied to the exact Wasmtime version. Members inherit the pin from here and
# keep only their own feature selection.
[workspace]
resolver = "2"
members = [
    "crates/cogwasm-runtime",
    "crates/cogwasm-host",
    "crates/cogwasm-supervisor",
    "crates/difftest-host",
    "bench/host",
    "bench/gap",
]
# toolchain/ (ignored) holds upstream checkouts with their own Cargo
# workspaces: the rust tree (src/bootstrap), clif-to-wasm, Wild. Without this,
# Cargo walks up from them to this manifest and refuses to build them.
exclude = ["toolchain"]

[workspace.dependencies]
wasmtime = { version = "=50.0.2", default-features = false }
wasmtime-wasi = { version = "=50.0.2", default-features = false }
# Default features on: cogwasm-host used plain `wasmtime-environ = "=50.0.2"`.
wasmtime-environ = "=50.0.2"
# Shared verbatim by several members.
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
