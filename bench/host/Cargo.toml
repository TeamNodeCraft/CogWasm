[package]
name = "bench-host"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bench-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The small parts of the host that are identical to the product host's copy.
cogwasm-runtime = { path = "../../crates/cogwasm-runtime" }
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
# Same pinned Wasmtime and engine configuration as the product host (the pin is
# in the root workspace). The cogwasm-host library supplies `engine()` and the
# precompiled-artifact loader, so the benchmark measures the host the product
# actually ships.
wasmtime = { workspace = true, features = ["cranelift", "runtime", "std", "cache", "anyhow", "threads"] }
wasmtime-wasi = { workspace = true, features = ["p1"] }
wasmparser = "0.263"
cogwasm-host = { path = "../../crates/cogwasm-host" }
