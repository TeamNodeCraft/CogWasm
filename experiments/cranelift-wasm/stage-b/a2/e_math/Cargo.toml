[package]
name = "e_math"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# no_std-compatible sin/cos/sqrt; this is a normal plugin dependency, compiled
# with the same backend/flags as the plugin (not part of the -Zbuild-std sysroot).
libm = { version = "0.2", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2

# Standalone: not part of the root host workspace.
[workspace]
