[package]
name = "stage-b-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stage-b-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmparser = "0.263"
# Wasmtime 46.0.3 is the last release with wasi-threads support (removed in 47);
# rustc.wasm always spawns its compiler thread, so this is required.
wasmtime = { version = "=46.0.3", default-features = false, features = ["cranelift", "runtime", "std", "cache", "anyhow", "threads"] }
wasmtime-wasi = { version = "=46.0.3", default-features = false, features = ["p1"] }
wasmtime-wasi-threads = "=46.0.3"

# Standalone: not part of the root host workspace.
[workspace]
