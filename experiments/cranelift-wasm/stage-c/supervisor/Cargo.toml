[package]
name = "cogwasm-supervisor"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cogwasm_supervisor"
path = "src/lib.rs"

[[bin]]
name = "cogwasm-supervisor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The real runtime for the M3 swap demo; `wat` lets tests build an instance
# without a toolchain.
wasmtime = { version = "=50.0.2", default-features = false, features = ["cranelift", "runtime", "std", "anyhow", "wat"] }

[dev-dependencies]
tempfile = "3"
