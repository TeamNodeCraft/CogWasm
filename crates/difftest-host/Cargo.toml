[package]
name = "difftest-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "difftest-host"
path = "src/main.rs"

[[bin]]
name = "difftest-gen"
path = "src/bin/generate.rs"

[dependencies]
anyhow = "1"
# Same pin as the cogwasm-host (from the root workspace). Features match
# crates/cogwasm-host/Cargo.toml so the release build can reuse
# toolchain/target/cogwasm-host's compiled dependencies.
wasmtime = { workspace = true, features = ["cranelift", "runtime", "std", "cache", "anyhow", "threads"] }
