[package]
name = "cogwasm-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# The store builder needs the runtime API and WASI; the engine configuration
# and the precompiled loader stay in `cogwasm-host`.
wasmtime = { workspace = true, features = ["std", "runtime"] }
wasmtime-wasi = { workspace = true, features = ["p1"] }

[dev-dependencies]
# The guest-memory tests compile a tiny module; production users of this crate
# are handed an already-compiled `Module` by `cogwasm-host`.
wasmtime = { workspace = true, features = ["std", "runtime", "cranelift"] }
tempfile = "3"
