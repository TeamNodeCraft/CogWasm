[package]
name = "cogwasm-bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cogwasm-bench"
path = "src/main.rs"

[dependencies]
analyzeme = "=12.0.3"
anyhow = "1"
clap = { workspace = true }
cogwasm-host = { path = "../cogwasm-host" }
cogwasm-runtime = { path = "../cogwasm-runtime" }
cogwasm-supervisor = { path = "../cogwasm-supervisor" }
# rustc.wasm is built with wasmparser 0.263; the instrumenter must use the
# same version as the module parser it pairs with.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
wasm-encoder = { version = "=0.263.0", default-features = false, features = ["std", "wasmparser"] }
wasmparser = "=0.263.0"
wasmtime = { workspace = true, features = ["cranelift", "runtime", "std", "cache", "anyhow", "threads", "wat"] }
wasmtime-wasi = { workspace = true, features = ["p1"] }

[dev-dependencies]
tempfile = "3"
wat = "1"
