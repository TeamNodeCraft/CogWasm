name: bench

# Full product benchmark suite. Weekly and on demand; the quick subset runs in
# the cranelift_wasm pipeline on every compiler change.
#
# The optional `base` input is a commit SHA whose previously published JSON
# (on the `bench-results` release) should be used for the comparison. Without
# it the newest published full run is used.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Commit SHA of a published run to compare against (optional)'
        required: false
        type: string
      record_history:
        description: 'Commit this result to bench/history/'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      RUSTUP_HOME: ${{ github.workspace }}/toolchain/rustup
      CARGO_HOME: ${{ github.workspace }}/toolchain/cargo
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pins live in compiler/upstreams.toml. Read them once so the cache
      # keys below are built from the manifest instead of a second literal copy.
      - name: read version pins
        id: pins
        run: |
          {
            echo "rust_nightly=$(python3 compiler/scripts/upstream.py get rust-nightly version)"
            echo "rust_stable=$(python3 compiler/scripts/upstream.py get rust-stable version)"
            echo "wasi_sdk_version=$(python3 compiler/scripts/upstream.py get wasi-sdk version)"
          } >> "$GITHUB_OUTPUT"

      - name: free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libclang-dev curl xz-utils zstd

      # Same caches as cranelift_wasm.yml, keyed identically so the weekly run
      # reuses the toolchain and registry the push builds already populated.
      - name: restore rustup toolchains
        id: cache-rustup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/rustup
            toolchain/cargo/bin
          key: cranelift-wasm-rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust_nightly }}-${{ steps.pins.outputs.rust_stable }}-v1

      - name: restore cargo registry and git
        id: cache-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/cargo/registry
            toolchain/cargo/git
          key: cranelift-wasm-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'guests/*/Cargo.lock') }}-v1
          restore-keys: |
            cranelift-wasm-cargo-${{ runner.os }}-

      - name: restore pinned source checkouts
        id: cache-src
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/playground
            toolchain/clif-to-wasm
            toolchain/wild
          key: cranelift-wasm-src-${{ runner.os }}-${{ hashFiles('compiler/patches/**', 'compiler/upstreams.toml') }}-f5298630-0e4e0458-fd79578-v1

      - name: restore wasi-sdk
        id: cache-wasi-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/wasi-sdk-${{ steps.pins.outputs.wasi_sdk_version }}-x86_64-linux
            toolchain/wasi-sdk
          key: cranelift-wasm-wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.wasi_sdk_version }}-v2

      - name: build rustc.wasm, host and pure sysroot
        run: |
          bash ci/setup-toolchain.sh
          bash compiler/scripts/build-rustc-wasm.sh
          bash compiler/scripts/build-host.sh
          bash compiler/scripts/build-pure-sysroot.sh

      - name: run full benchmark suite
        run: |
          bash bench/run.sh --full --out bench/results/full.json

      - name: fetch comparison base
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash bench/scripts/find-base.sh bench/work/base.json "${{ inputs.base }}"

      - name: compare with the previous full run
        run: |
          if [ -f bench/work/base.json ]; then
            python3 bench/compare.py bench/work/base.json bench/results/full.json \
              > bench/results/compare.md || true
          else
            printf 'No previous full run is published; this run is the baseline.\n' \
              > bench/results/compare.md
          fi
          cat bench/results/full.md >> "${GITHUB_STEP_SUMMARY}"
          cat bench/results/compare.md >> "${GITHUB_STEP_SUMMARY}"

      - name: publish to the bench-results release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash bench/scripts/publish-results.sh \
            bench/results/full.json bench/results/full.md bench/results/compare.md

      - name: record in bench/history (explicitly requested)
        if: ${{ inputs.record_history }}
        run: |
          mkdir -p bench/history
          dest="bench/history/$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:12}.json"
          cp bench/results/full.json "$dest"
          git config user.name 'CogWasm CI'
          git config user.email 'ci@cogwasm.invalid'
          git add "$dest"
          if git diff --cached --quiet; then
            echo "bench/history already has this result"
          else
            git commit -m "bench: record CI results for ${GITHUB_SHA:0:12}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-full-${{ github.run_id }}
          path: |
            bench/results/full.json
            bench/results/full.md
            bench/results/compare.md
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
