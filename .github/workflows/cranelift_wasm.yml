name: cranelift_wasm

# Pure-Rust compiler path: build rustc.wasm with cg_clif/clif-to-wasm only,
# build the plugin sysroot with rustc.wasm itself, run plugin (c) end to end on
# Wasmtime, assert A.2 (e)/(f) correctness, and prove there is no LLVM
# inside rustc.wasm. The logic lives in
# ci/build-and-test.sh so the same script runs
# locally on macOS and on this Linux runner.
on:
  push:
    branches:
      - main
    # Only what can change the compiler, the benchmark programs or what CI runs
    # on them. Docs, the chart's code (it is regenerated on the next build),
    # committed history and analysis output don't need a one-hour rebuild.
    paths:
      - 'compiler/**'
      - 'crates/**'
      - 'guests/**'
      - 'difftest/**'
      - 'ci/**'
      - 'release/**'
      - 'bench/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cranelift_wasm.yml'
      - '!**/*.md'
      - '!compiler/upstream/**'
      - '!compiler/**/notes/**'
      - '!bench/chart/**'
      - '!bench/history/**'
      - '!bench/gap/results/**'
  workflow_dispatch:
    inputs:
      mir_hoist:
        description: "Enable the experimental loop-field hoist in clif program compiles"
        type: boolean
        default: false
      inline_wasm:
        description: "Enable the experimental loop-aware MIR inliner in clif program compiles"
        type: boolean
        default: false

# A newer push to main supersedes an older build: only the newest commit's
# result matters, so cancel the older run instead of building both. A
# cancelled commit simply gets no point on the benchmark chart.
concurrency:
  group: cranelift_wasm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The job publishes the full log and bench-history to releases, so it
    # needs write; backfill also reads the Actions runs API, so it needs
    # actions read. The workflow default above stays read-only.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pins live in compiler/upstreams.toml. Read them once so the cache
      # keys below are built from the manifest instead of a second literal copy.
      - name: read version pins
        id: pins
        run: |
          {
            echo "rust_nightly=$(python3 compiler/scripts/upstream.py get rust-nightly version)"
            echo "rust_stable=$(python3 compiler/scripts/upstream.py get rust-stable version)"
            echo "wasi_sdk_version=$(python3 compiler/scripts/upstream.py get wasi-sdk version)"
          } >> "$GITHUB_OUTPUT"

      - name: free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libclang-dev curl xz-utils zstd

      # Cache what is slow to download and cheap to restore (rustup, Cargo
      # registry, the pinned checkouts, wasi-sdk), plus the compiler outputs
      # below. The 12 GB rustc build tree itself is never cached.
      - name: restore rustup toolchains
        id: cache-rustup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/rustup
            toolchain/cargo/bin
          key: cranelift-wasm-rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust_nightly }}-${{ steps.pins.outputs.rust_stable }}-v1

      - name: restore cargo registry and git
        id: cache-cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/cargo/registry
            toolchain/cargo/git
          key: cranelift-wasm-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'guests/*/Cargo.lock') }}-v1
          restore-keys: |
            cranelift-wasm-cargo-${{ runner.os }}-

      - name: restore pinned source checkouts
        id: cache-src
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/playground
            toolchain/clif-to-wasm
            toolchain/wild
          key: cranelift-wasm-src-${{ runner.os }}-${{ hashFiles('compiler/patches/**', 'compiler/upstreams.toml') }}-f5298630-0e4e0458-fd79578-v2

      - name: restore wasi-sdk
        id: cache-wasi-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/wasi-sdk-${{ steps.pins.outputs.wasi_sdk_version }}-x86_64-linux
            toolchain/wasi-sdk
          key: cranelift-wasm-wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.wasi_sdk_version }}-v2

      # The ~26 minute rustc.wasm build (plus the stage1 compiler it needs at
      # run time, the pure sysroot and the Wild linker) is what this workflow
      # spends most of its time on. Cache the outputs, not the 12 GB build tree:
      # about 800 MB, or ~250 MB compressed.
      #
      # The key is the rule: it lists every input that can change the cached
      # bytes - the patch manifest and series, every script that builds them, the
      # pins for the rust commit/nightly/wasi-sdk, and c_plugin's manifest
      # because -Zbuild-std takes the sysroot's profile from it. Add an input to the
      # build and it must be added here. Nothing is restored on a near miss (no
      # restore-keys), and a hit still rebuilds the host, recompiles every
      # plugin program and runs every correctness step, so a stale compiler
      # cannot turn a broken patch green.
      - name: restore compiler outputs
        id: cache-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/artifacts
            toolchain/sysroot
            toolchain/rust/build/host/stage1
            toolchain/target/wild/release/wild
          key: cranelift-wasm-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/patches/**', 'compiler/upstreams.toml', 'compiler/scripts/upstream.py', 'compiler/scripts/build-rustc-wasm.sh', 'compiler/scripts/build-pure-sysroot.sh', 'compiler/scripts/rustc-wasm-wrapper.sh', 'guests/c_plugin/Cargo.*', 'compiler/scripts/setup-sources.sh', 'ci/setup-toolchain.sh') }}-v2

      - name: build and test
        env:
          # Only the exact-input cache hit is allowed to skip the build; the id
          # is unset on a miss, and build-and-test.sh then builds from source.
          CI_REUSE_COMPILER: ${{ steps.cache-compiler.outputs.cache-hit }}
          # Goal 1 step 5b experiments: opt difftest into the loop-field hoist
          # and the loop-aware MIR inliner.
          DIFFTEST_MIR_HOIST: ${{ github.event.inputs.mir_hoist == 'true' && '1' || '' }}
          DIFFTEST_INLINE_WASM: ${{ github.event.inputs.inline_wasm == 'true' && '1' || '' }}
        run: |
          bash ci/build-with-diagnostics.sh \
            "${RUNNER_TEMP}/cranelift-wasm.log" \
            bash ci/build-and-test.sh

      - name: save compiler outputs
        if: success() && steps.cache-compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/artifacts
            toolchain/sysroot
            toolchain/rust/build/host/stage1
            toolchain/target/wild/release/wild
          key: cranelift-wasm-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/patches/**', 'compiler/upstreams.toml', 'compiler/scripts/upstream.py', 'compiler/scripts/build-rustc-wasm.sh', 'compiler/scripts/build-pure-sysroot.sh', 'compiler/scripts/rustc-wasm-wrapper.sh', 'guests/c_plugin/Cargo.*', 'compiler/scripts/setup-sources.sh', 'ci/setup-toolchain.sh') }}-v2

      # A CI-sized subset of the product benchmark suite. It reuses the
      # rustc.wasm, sysroot, Wild and Cargo target directory this job just
      # built, so it adds about two minutes rather than a second full build.
      # On a compiler-cache hit it is what runs: a benchmark-only change no
      # longer pays for the compiler. --fuel adds one fuel-enabled rustc.wasm
      # compile per program (the first load pays the module compile, later
      # programs hit the Wasmtime cache).
      - name: quick performance suite
        if: success()
        env:
          # Goal 1 step 5b experiments: opt the clif program compiles into the
          # loop-field hoist or the loop-aware MIR inliner. The LLVM reference
          # compiler is unchanged.
          BENCH_MIR_HOIST: ${{ github.event.inputs.mir_hoist == 'true' && '1' || '' }}
          BENCH_INLINE_WASM: ${{ github.event.inputs.inline_wasm == 'true' && '1' || '' }}
        run: |
          if [ "${BENCH_MIR_HOIST}" = "1" ] || [ "${BENCH_INLINE_WASM}" = "1" ]; then
            # An opt-in MIR pass can make sha256's compiler fuel differ by a
            # few units between samples, which the --fuel agreement guard
            # rejects. The runtime instruction counts are still measured by the
            # deterministic-counts step below.
            bash bench/run.sh --quick --runs 3 \
              --out "bench/results/quick-${GITHUB_RUN_ID}.json"
          else
            bash bench/run.sh --quick --runs 3 --fuel \
              --out "bench/results/quick-${GITHUB_RUN_ID}.json"
          fi

      # Exact executed wasm instructions for the same quick modules, plus the
      # compiler-work median already in the JSON. Two measurements per module
      # are compared inside count.py, so a drifting count stops the run.
      - name: deterministic instruction counts
        if: success()
        run: |
          json=$(ls bench/results/quick-*.json 2>/dev/null | tail -n 1)
          bash bench/gap/count-quick.sh "$json"
          cat "${json%.json}.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: codegen structure checks
        if: success()
        run: bash bench/gap/check-codegen.sh

      - name: upload benchmark result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-quick-${{ github.run_id }}
          path: |
            bench/results/quick-*.json
            bench/results/quick-*.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: publish benchmark result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          json=$(ls bench/results/quick-*.json 2>/dev/null | tail -n 1 || true)
          markdown=${json%.json}.md
          if [ -n "$json" ] && [ -f "$markdown" ]; then
            bash bench/scripts/publish-ci.sh "$json" "$markdown"
          else
            echo "::warning::no quick benchmark result to publish"
          fi

      # One durable point per main commit on the append-only bench-history
      # release, then regenerate the README SVG and the interactive-page data
      # from every point. Backfill first (it imports the 8476eeb result that
      # predates the release), then publish this run (which also replaces a
      # re-run's own point), then rebuild the chart. PRs never get here: the
      # workflow only runs on main pushes and manual main dispatches.
      - name: publish benchmark history and chart
        # An experiment run compiles programs with an opt-in pass, so it must
        # not add a point that the chart would compare with the default build.
        if: success() && github.ref == 'refs/heads/main' && github.event.inputs.mir_hoist != 'true' && github.event.inputs.inline_wasm != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          json=$(ls bench/results/quick-*.json 2>/dev/null | tail -n 1 || true)
          if [ -z "$json" ] || [ ! -f "$json" ]; then
            echo "::warning::no quick benchmark result to record in bench-history"
            exit 0
          fi
          bash bench/scripts/backfill-history.sh
          bash bench/scripts/publish-history.sh "$json"
          bash bench/scripts/build-chart.sh

      # The site's live REPL downloads this run's rustc.wasm, wild.wasm and
      # sysroot (packaged and checked by ci/build-and-test.sh) from the `repl`
      # release; deploy_pages.yml copies them into the site after this run.
      - name: publish the in-browser REPL compiler
        if: success() && github.ref == 'refs/heads/main' && github.event.inputs.mir_hoist != 'true' && github.event.inputs.inline_wasm != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash ci/publish-repl-assets.sh toolchain/work/repl-assets

      # The full log is published even when the build fails, and the log
      # helper above adds ::error annotations for the interesting lines.
      - name: publish build log
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash ci/publish-build-log.sh \
            "${RUNNER_TEMP}/cranelift-wasm.log" cranelift-wasm

      - name: save rustup toolchains
        if: success() && steps.cache-rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/rustup
            toolchain/cargo/bin
          key: cranelift-wasm-rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust_nightly }}-${{ steps.pins.outputs.rust_stable }}-v1

      - name: save cargo registry and git
        if: success() && steps.cache-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/cargo/registry
            toolchain/cargo/git
          key: cranelift-wasm-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'guests/*/Cargo.lock') }}-v1

      - name: save pinned source checkouts
        if: success() && steps.cache-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/playground
            toolchain/clif-to-wasm
            toolchain/wild
          key: cranelift-wasm-src-${{ runner.os }}-${{ hashFiles('compiler/patches/**', 'compiler/upstreams.toml') }}-f5298630-0e4e0458-fd79578-v2

      - name: save wasi-sdk
        if: success() && steps.cache-wasi-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/wasi-sdk-${{ steps.pins.outputs.wasi_sdk_version }}-x86_64-linux
            toolchain/wasi-sdk
          key: cranelift-wasm-wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.wasi_sdk_version }}-v2

      - name: upload rustc.wasm and pure sysroot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cranelift-wasm-rustc-wasm-${{ github.run_id }}
          path: |
            toolchain/artifacts/rustc.wasm
            toolchain/sysroot
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
