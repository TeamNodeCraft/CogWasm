name: deploy pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'artwork/**'
      - 'README.md'
      - '.github/workflows/deploy_pages.yml'
  workflow_run:
    # "create release" mirrors the release assets as before; cranelift_wasm
    # rebuilds bench-history (point + chart.svg + data.json), so its successful
    # main runs refresh the interactive benchmark page too.
    workflows: ["create release", "cranelift_wasm"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build and upload in one job, deploy in another, as GitHub's own Pages
  # workflow does. In a single job, actions/deploy-pages sometimes looked the
  # artifact up before it was registered and failed with 'No artifacts named
  # "github-pages" were found' although the upload had succeeded (runs
  # 44915750812, 44974667658, 44983144230, 45041956748).
  build:
    # Only run if triggered manually, after a successful create-release run,
    # or after a successful cranelift_wasm run on main. PRs and side branches
    # never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name != 'cranelift_wasm' ||
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the project site at the root. build.py fills in the commit and
      # date and copies the artwork from artwork/cog-logo/, so those SVGs stay
      # single-sourced in git.
      - name: Build the project site
        run: python3 site/build.py --output public

      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          # Get all release tags
          gh release list --json tagName -q ".[].tagName" > tags.txt
          while read -r TAG; do
            # The REPL's compiler goes to repl/assets/ (the step below), not
            # into a second 40 MB copy here.
            [ "$TAG" = repl ] && continue
            # Extract version from tag (e.g., v0.2.0-release -> v0.2.0)
            DIR_NAME=${TAG%-release}
            echo "Processing release: $TAG into directory: public/$DIR_NAME"
            mkdir -p "public/$DIR_NAME"
            gh release download "$TAG" --dir "public/$DIR_NAME/" --pattern "*" || echo "Failed to download $TAG"
          done < tags.txt
          rm tags.txt
          ls -lR public/

      # The interactive chart lives in the site's Benchmarks section (build.py
      # copies its code); its data and the static image come from the same
      # bench-history assets the README uses.
      - name: Download benchmark chart data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/bench
          if gh release view bench-history >/dev/null 2>&1; then
            gh release download bench-history --pattern chart.svg \
              --dir public/bench --clobber \
              || echo "::warning::bench-history has no chart.svg yet"
            gh release download bench-history --pattern data.json \
              --dir public/bench --clobber \
              || echo "::warning::bench-history has no data.json yet"
          else
            echo "::warning::bench-history release does not exist yet; the page will show no data"
          fi

      # The live REPL's compiler (rustc.wasm, wild.wasm, sysroot, manifest.json)
      # comes from the `repl` release that cranelift_wasm publishes on main.
      # Without it the page says the compiler is not published yet.
      - name: Download the REPL compiler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/repl/assets
          if gh release view repl >/dev/null 2>&1; then
            gh release download repl --dir public/repl/assets --clobber
            ls -l public/repl/assets
          else
            echo "::warning::the repl release does not exist yet; the live REPL will say so"
          fi

      # Enabling Pages is a repository setting, not something this workflow may
      # change. Fail with an actionable message instead of letting
      # actions/configure-pages fail with a generic error.
      - name: Check GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY} (GET /repos/${GITHUB_REPOSITORY}/pages returned ${status}). The repository owner must enable it: Settings > Pages > Source: GitHub Actions."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
