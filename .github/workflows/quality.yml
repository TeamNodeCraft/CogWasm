name: quality

# Anti-pattern review scan (agents/skills/anti-pattern-review.md) on our own
# code. ast-grep error-level rules block; fmt/clippy/shellcheck findings are
# reported until the existing ones are fixed (agents/ROADMAP.md, Quality work),
# then this job switches to --strict.
on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/*.sh"
      - "**/*.py"
      - "clippy.toml"
      - "sgconfig.yml"
      - "ast-grep/**"
      - "agents/**"
      - ".github/workflows/quality.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-scan:
    # The job publishes the full scan log to the ci-logs pre-release, so it
    # needs write; the workflow default above stays read-only.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      - name: ast-grep (pinned)
        run: npm install --global @ast-grep/cli@0.51.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-quality
          key: quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Review scan
        env:
          CARGO_TARGET_DIR: target-quality
        run: |
          bash ci/build-with-diagnostics.sh \
            "${RUNNER_TEMP}/quality.log" \
            bash agents/scripts/review-scan.sh

      - name: supervisor golden tests
        env:
          CARGO_TARGET_DIR: target-quality
        run: |
          cargo test --manifest-path crates/cogwasm-supervisor/Cargo.toml

      # Publish the full log even when the scan fails, so it can be read
      # without signing in to GitHub (the rolling ci-logs pre-release).
      - name: publish scan log
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash ci/publish-build-log.sh \
            "${RUNNER_TEMP}/quality.log" quality

      # Surface the public log URL on the failed check itself: job logs need
      # a signed-in account, the ci-logs asset does not.
      - name: link the published log
        if: failure()
        run: |
          echo "::error title=quality scan failed::full log: https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-logs/quality-${GITHUB_RUN_ID}.log"
